server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida se resuelve con el index (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El dashboard llama a `/api/v1/...`; nginx lo envía a la API por la red de
    # Compose, así el navegador nunca habla directamente con la API.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Estáticos con caché larga (los nombres llevan hash de contenido).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
